[project]
name = "jean"
version = "0.1.0"
description = "A small Liquid vision-language decision model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["torch>=2.8", "torchvision>=0.23", "transformers>=5.8.1,<6", "pillow>=11"]

[project.scripts]
jean-train = "jean.train:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
